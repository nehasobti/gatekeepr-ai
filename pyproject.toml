[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper-ai"
version = "1.0.0"
description = "AI-powered quality gate for pull requests"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gatekeeper AI Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "anthropic>=0.30.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "unidiff>=0.7.5",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "syrupy>=4.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240311",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
gatekeeper = "gatekeeper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length is formatted with ruff format
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
implicit_reexport = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = [
    "unidiff",
    "unidiff.*",
    "respx",
    "respx.*",
    "syrupy",
    "syrupy.*",
]
ignore_missing_imports = true
